
name: Build APK

# يبني تطبيق أندرويد (APK) في السحابة. يعمل تلقائياً عند الرفع،
# ويمكن تشغيله يدوياً من تبويب Actions (زر Run workflow) من الهاتف.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'   # إن فشل البناء بسبب Java جرّب '17'

      - name: Prepare web assets (www)
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/; else echo "index.html غير موجود في جذر المستودع"; exit 1; fi
          for f in manifest.json sw.js icon-192.png icon-512.png; do
            if [ -f "$f" ]; then cp "$f" www/; else echo "تخطّي $f"; fi
          done
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js -o www/qrcode.min.js || echo "تعذّر تنزيل qrcode (سيُستخدم الإنترنت تلقائياً)"

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Write Capacitor config
        run: |
          cat > capacitor.config.json << 'JSON'
          {
            "appId": "com.salif.wheatops",
            "appName": "تفريغ القمح",
            "webDir": "www"
          }
          JSON

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web assets into Android
        run: npx cap copy android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wheat-ops-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
