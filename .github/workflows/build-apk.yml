name: Build APK

# يبني تطبيق أندرويد (APK) في السحابة من مشروع Capacitor المُضمَّن في المستودع.
# يعمل تلقائياً عند الرفع، ويمكن تشغيله يدوياً من تبويب Actions (زر Run workflow).
# Builds the Android debug APK from the committed Capacitor project.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'   # إن فشل البناء بسبب Java جرّب '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync Capacitor (copy web assets into Android)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wheat-ops-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
